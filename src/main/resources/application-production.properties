# Production profile
spring.h2.console.enabled=false

# Keep these in environment/secret manager for production
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Production-safe JPA settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# HikariCP tuning
spring.datasource.hikari.pool-name=EcomHikariPool
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:20}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.validation-timeout=${DB_POOL_VALIDATION_TIMEOUT_MS:5000}

# Graceful shutdown and safer server errors
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# Response compression for better throughput
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript

# Production logging defaults
logging.level.root=INFO
logging.level.com.app.ecom=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Disable Swagger UI in production (enable only if behind VPN or internal access)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# CORS: only allow deployed frontend domain in production
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://your-main-domain.com}
app.cors.allowed-origin-patterns=


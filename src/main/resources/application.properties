spring.application.name=ecom-application
server.port=${PORT:${SERVER_PORT:8081}}
server.address=0.0.0.0

# CORS (profile overrides below)
app.cors.allowed-origins=
app.cors.allowed-origin-patterns=

# Active profile should come from environment in deployment platforms.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:development}

# JWT configuration
app.jwt.secret=${APP_JWT_SECRET:VGhpc0lzQVN0cm9uZ0pXVFNlY3JldEtleUZvckVjb21BcHAxMjM0NTY3ODkw}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
app.jwt.refresh-expiration-ms=${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
app.auth.admin-registration-secret=${APP_AUTH_ADMIN_REGISTRATION_SECRET:change-me-admin-secret}

# Logging configuration
logging.level.root=INFO
logging.level.com.app.ecom=INFO
logging.level.org.springframework.security=WARN


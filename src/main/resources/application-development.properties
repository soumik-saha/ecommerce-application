# Development profile
spring.h2.console.enabled=false

spring.datasource.url=${DEV_DB_URL:jdbc:postgresql://localhost:5432/ecom_preuat}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DEV_DB_USERNAME:postgres}
spring.datasource.password=${DEV_DB_PASSWORD:root}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Verbose enough for local debugging
logging.level.com.app.ecom=INFO
logging.level.org.springframework.security=WARN


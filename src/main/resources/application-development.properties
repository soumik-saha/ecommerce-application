# Development profile
spring.h2.console.enabled=false

spring.datasource.url=${DEV_DB_URL:jdbc:postgresql://localhost:5432/ecom_preuat}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DEV_DB_USERNAME:postgres}
spring.datasource.password=${DEV_DB_PASSWORD:root}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Verbose enough for local debugging
logging.level.com.app.ecom=INFO
logging.level.org.springframework.security=WARN

# Swagger UI enabled in development
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# CORS: allow all localhost/loopback origins in development
app.cors.allowed-origins=http://localhost:4200,http://localhost:5173
app.cors.allowed-origin-patterns=http://localhost:*,https://localhost:*,http://127.0.0.1:*,https://127.0.0.1:*


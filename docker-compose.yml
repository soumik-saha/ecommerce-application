version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: ecom-postgres
    environment:
      POSTGRES_DB: ecom_db
      POSTGRES_USER: ecom_user
      POSTGRES_PASSWORD: ecom_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecom_user -d ecom_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: ecom-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: production
      PORT: 8081
      DB_URL: jdbc:postgresql://db:5432/ecom_db
      DB_USERNAME: ecom_user
      DB_PASSWORD: ecom_pass
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-3600000}
      APP_AUTH_ADMIN_REGISTRATION_SECRET: ${APP_AUTH_ADMIN_REGISTRATION_SECRET:?APP_AUTH_ADMIN_REGISTRATION_SECRET must be set}
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    restart: unless-stopped

volumes:
  postgres_data:
